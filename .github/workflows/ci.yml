name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: node --test tests/pratos.test.mjs
      - run: uvx ruff check notebooks
      - run: uvx ruff format --check notebooks
